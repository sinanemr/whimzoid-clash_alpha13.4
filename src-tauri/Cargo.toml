[package]
name = "what-just-hit-me"
version = "1.0.0"
description = "What Just Hit Me desktop client"
authors = ["What Just Hit Me"]
edition = "2021"
rust-version = "1.77.2"

# The library the Tauri app runs through (main.rs -> run()).
[lib]
name = "what_just_hit_me_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
