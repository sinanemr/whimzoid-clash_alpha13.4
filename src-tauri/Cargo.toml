[package]
name = "whimzoid-clash"
version = "13.4.0"
description = "Whimzoid Clash desktop client"
authors = ["Whimzoid"]
edition = "2021"
rust-version = "1.77.2"

# The library the Tauri app runs through (main.rs -> run()).
[lib]
name = "whimzoid_clash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
